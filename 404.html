<!doctype html>
<html lang="id" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark light">
  <meta name="robots" content="noindex, nofollow">
  <title>Halaman tidak ditemukan: Muhammad Nur Rahman</title>
  <link rel="stylesheet" href="/css/style.css">
  <script>
    try {
      const savedTheme = localStorage.getItem('rahman-portfolio-theme');
      document.documentElement.dataset.theme = savedTheme === 'light' || savedTheme === 'dark' ? savedTheme : matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
    } catch {
      document.documentElement.dataset.theme = matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
    }
  </script>
</head>
<body>
  <main class="not-found">
    <p class="section-kicker">404 · HALAMAN TIDAK DITEMUKAN</p>
    <h1>Sepertinya tautan ini<br><em>sudah tersesat.</em></h1>
    <p>Alamat yang kamu buka tidak tersedia. Kembali ke portofolio untuk melihat proyek dan perjalanan saya.</p>
    <a class="button button-primary" href="/">Kembali ke beranda <span aria-hidden="true">↗</span></a>
  </main>
</body>
</html>
